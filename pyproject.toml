[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-cleaner"
version = "0.1.0"
description = "A safe command-line tool for cleaning CSV files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
csv-clean = "csv_cleaner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]